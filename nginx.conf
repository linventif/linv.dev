server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    location ~ ^/(creations|docs|colors)/?$ {
        return 302 /#projets;
    }

    location ~ ^/(social|terms)/?$ {
        return 302 /#projets;
    }

    location = /github {
        return 302 https://github.com/linventif;
    }

    location = /discord {
        return 302 https://discord.com/invite/EkVPk9y;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ (^|/)\. {
        return 404;
    }

    location ~ ^/(nginx\.conf|compose\.yaml|README\.md)$ {
        return 404;
    }
}
